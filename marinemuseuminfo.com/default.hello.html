
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>hello</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: white;
                color: black;
                margin: 20px;
            }
            h1 {
                color: #0D47A1;
                border-bottom: 2px solid #0D47A1;
                padding-bottom: 10px;
            }
            h2 {
                color: #0D47A1;
                border-bottom: 1px solid #0D47A1;
                padding-bottom: 5px;
            }
            .section {
                margin-bottom: 20px;
                padding: 15px;
                border: 1px solid #0D47A1;
                border-radius: 8px;
                background-color: #f9f9f9;
            }
            .image {
                margin: 10px 0;
                padding: 5px;
                border: 1px solid #0D47A1;
                border-radius: 5px;
                text-align: left;
            }
            .image img {
                max-width: 100vw;
                max-height: 100vh;
                width: auto;
                height: auto;
                object-fit: contain;
                border-radius: 5px;
            }
            .biblio, .tags {
                padding: 10px;
                border: 1px solid #0D47A1;
                border-radius: 5px;
                background-color: #f1faff;
            }
            p {
                line-height: 1.6;
            }
        </style>
    </head>
    <body>
        <h1>hello</h1>
        
        <div class="section">
            <h2>Description</h2>
            <p>ok</p>
        </div>
        
    </body>
    </html>
